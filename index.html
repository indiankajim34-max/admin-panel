<script>
    const firebaseConfig = {
      apiKey: "AIzaSyD_24prkpu6ylZITC1EM08jptSCuFbCAp0",
      authDomain: "wingo-vip-759b9.firebaseapp.com",
      projectId: "wingo-vip-759b9",
      storageBucket: "wingo-vip-759b9.firebasestorage.app",
      messagingSenderId: "304008432437",
      appId: "1:304008432437:web:cba7a59be9e1079ffd9a7c",
      measurementId: "G-70XVCDYQQ9"
    };
    
    // Check if firebase is already initialized
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let paymentTimerInterval;
    const SESSION_ID = 'win_session_' + Math.random().toString(36).substring(2);

    function switchView(view) {
        if(view === 'register') {
            document.getElementById('loginFormContainer').style.display = 'none';
            document.getElementById('registerFormContainer').style.display = 'block';
        } else {
            document.getElementById('registerFormContainer').style.display = 'none';
            document.getElementById('loginFormContainer').style.display = 'block';
        }
    }

    function sendGoogleOtp() {
        const email = document.getElementById('regEmail').value;
        const pass = document.getElementById('regPass').value;
        const confirmPass = document.getElementById('regPassConfirm').value;
        const username = document.getElementById('regUser').value;

        if (!username || !email || !pass) {
            alert("Pehle Username, Password aur Email bhariye!");
            return;
        }
        if (pass !== confirmPass) {
            alert("Passwords match nahi kar rahe!");
            return;
        }

        const msgBox = document.getElementById('regMsg');
        msgBox.innerHTML = "<div class='success'>Sending Verification Email...</div>";

        firebase.auth().createUserWithEmailAndPassword(email, pass)
            .then((userCredential) => {
                userCredential.user.sendEmailVerification()
                    .then(() => {
                        msgBox.innerHTML = "<div class='success'>✔ Email sent to " + email + ". Link par click karke verify karein!</div>";
                    })
                    .catch((error) => {
                        msgBox.innerHTML = "<div class='error'>Error: " + error.message + "</div>";
                    });
            })
            .catch((error) => {
                msgBox.innerHTML = "<div class='error'>Error: " + error.message + "</div>";
            });
    }

    function handleRegister() {
        const user = firebase.auth().currentUser;
        const username = document.getElementById('regUser').value;
        const pass = document.getElementById('regPass').value;
        const msgBox = document.getElementById('regMsg');

        if (!username || !pass) {
            msgBox.innerHTML = "<div class='error'>Username aur Password zaroori hai!</div>";
            return;
        }

        if (user) {
            user.reload().then(() => {
                if (user.emailVerified) {
                    db.collection("resellers").doc(username).set({
                        username: username,
                        email: user.email,
                        password: pass,
                        role: "Customer",
                        todayDeposit: 0,
                        keyCount: 0,
                        createdAt: new Date()
                    }).then(() => {
                        msgBox.innerHTML = "<span class='success'>Registration successful! Please login.</span>";
                        setTimeout(() => switchView('login'), 2000);
                    }).catch((err) => {
                        msgBox.innerHTML = "<div class='error'>DB Error: " + err.message + "</div>";
                    });
                } else {
                    msgBox.innerHTML = "<div class='error'>Pehle apna Gmail khol kar verification link par click karein!</div>";
                }
            });
        } else {
            msgBox.innerHTML = "<div class='error'>Pehle 'SEND VERIFICATION EMAIL' par click karein!</div>";
        }
    }

    function handleLogin() {
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value.trim();
        const msgBox = document.getElementById('loginMsg');

        if(!username || !password) {
            msgBox.innerHTML = "<div class='error'>Username aur Password enter karein!</div>";
            return;
        }

        msgBox.innerHTML = "<div class='success'>Logging in...</div>";

        db.collection("resellers").doc(username).get().then((doc) => {
            if(doc.exists) {
                const data = doc.data();
                
                // अगर डेटाबेस में पासवर्ड सेट है और मैच नहीं हो रहा
                if (data.password && data.password !== password) {
                    msgBox.innerHTML = "<div class='error'>Galat Password! Sahi password dalein.</div>";
                    return;
                }

                db.collection("resellers").doc(username).update({ currentSession: SESSION_ID }).catch(err => console.log(err));

                document.getElementById('loginFormContainer').style.display = 'none';
                document.getElementById('dashboardContainer').style.display = 'block';
                document.getElementById('dashUsername').innerText = data.username;
                document.getElementById('dashRole').innerText = data.role || "Customer";
                document.getElementById('totalDeposit').innerText = data.todayDeposit || 0;
                document.getElementById('keyCount').innerText = data.keyCount || 0;
                msgBox.innerHTML = "";

            } else {
                msgBox.innerHTML = "<div class='error'>User nahi mila! Register karein.</div>";
            }
        }).catch((err) => {
            msgBox.innerHTML = "<div class='error'>Connection Error: " + err.message + "</div>";
        });
    }

    function initiatePaymentProcess() {
        document.getElementById('startPaymentBtn').style.display = 'none';
        document.getElementById('timerDisplay').style.display = 'block';
        document.getElementById('paymentInputs').style.display = 'block';

        let duration = 9 * 60; 
        const display = document.getElementById('timerDisplay');
        clearInterval(paymentTimerInterval);

        paymentTimerInterval = setInterval(() => {
            let minutes = parseInt(duration / 60, 10);
            let seconds = parseInt(duration % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            display.innerText = "Payment Timer: " + minutes + ":" + seconds;

            if (--duration < 0) {
                clearInterval(paymentTimerInterval);
                display.innerText = "Timer Expired! Please restart payment.";
                document.getElementById('paymentInputs').style.display = 'none';
            }
        }, 1000);
    }

    function verifyAutomaticPayment() {
        const utr = document.getElementById('utrInput').value.trim();
        const amount = parseFloat(document.getElementById('depositAmount').value);
        const username = document.getElementById('dashUsername').innerText;
        const msgBox = document.getElementById('depositMsg');

        if(!utr || utr.length < 10) {
            msgBox.innerHTML = "<div class='error'>Valid 12-digit UTR enter karein!</div>";
            return;
        }
        if(isNaN(amount) || amount <= 0) {
            msgBox.innerHTML = "<div class='error'>Sahi deposit amount enter karein!</div>";
            return;
        }

        msgBox.innerHTML = "<div class='success'>Verifying UTR via BharatPe API...</div>";

        setTimeout(() => {
            db.collection("utr_logs").doc(utr).get().then((utrDoc) => {
                if(utrDoc.exists) {
                    msgBox.innerHTML = "<div class='error'>Ye UTR pehle hi use ho chuka hai!</div>";
                    return;
                }

                const userRef = db.collection("resellers").doc(username);
                db.runTransaction((transaction) => {
                    return transaction.get(userRef).then((doc) => {
                        if (!doc.exists) throw "User does not exist!";
                        
                        let data = doc.data();
                        let newDeposit = (data.todayDeposit || 0) + amount;
                        let newKeys = (data.keyCount || 0) + Math.floor(amount / 100); 
                        let currentRole = data.role;

                        if (amount >= 500 && currentRole === "Customer") {
                            currentRole = "Reseller";
                        }

                        transaction.set(db.collection("utr_logs").doc(utr), {
                            username: username,
                            amount: amount,
                            timestamp: new Date()
                        });

                        transaction.update(userRef, {
                            todayDeposit: newDeposit,
                            keyCount: newKeys,
                            role: currentRole
                        });

                        return { newDeposit, newKeys, currentRole };
                    });
                }).then((res) => {
                    document.getElementById('totalDeposit').innerText = res.newDeposit;
                    document.getElementById('keyCount').innerText = res.newKeys;
                    document.getElementById('dashRole').innerText = res.currentRole;
                    msgBox.innerHTML = "<div class='success'>✔ Payment Auto-Verified! Role: " + res.currentRole + "</div>";
                    clearInterval(paymentTimerInterval);
                }).catch((err) => {
                    msgBox.innerHTML = "<div class='error'>Verification Failed: " + err + "</div>";
                });
            });
        }, 1500);
    }

    function handleLogout() {
        clearInterval(paymentTimerInterval);
        document.getElementById('dashboardContainer').style.display = 'none';
        document.getElementById('loginFormContainer').style.display = 'block';
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('loginMsg').innerHTML = '';
    }
</script>
