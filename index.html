<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinGo VIP - Dashboard</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { background: #0f0f1a; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #1a1a2e; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,255,102,0.2); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #00ff66; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; background: #0f0f1a; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: linear-gradient(45deg, #00ff66, #00b344); border: none; color: #000; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; box-sizing: border-box; }
        button:hover { opacity: 0.9; }
        .success { color: #00ff66; font-size: 13px; margin-top: 10px; }
        .error { color: #ff4d4d; font-size: 13px; margin-top: 10px; }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 14px; cursor: pointer; color: #00ff66; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="text-align: center; color: #00ff66;">WinGo VIP Panel</h2>

        <!-- Login Form -->
        <div id="loginFormContainer">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="loginUser" placeholder="Enter username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Enter password">
            </div>
            <button onclick="handleLogin()">LOGIN</button>
            <div id="loginMsg"></div>
            <div class="toggle-link" onclick="switchView('register')">Don't have an account? Register</div>
        </div>

        <!-- Register Form with Firebase Real Email Verification -->
        <div id="registerFormContainer" style="display: none;">
            <div class="input-group">
                <label>Choose Username</label>
                <input type="text" id="regUser" placeholder="Create username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="regPass" placeholder="Create password">
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="regPassConfirm" placeholder="Confirm password">
            </div>
            <!-- Ab Email box aur button dono baaki buttons ki tarah bilkul long (100% width) hain -->
            <div class="input-group">
                <label>Email Address (Real Verification)</label>
                <input type="email" id="regEmail" placeholder="Enter your email">
                <button type="button" onclick="sendGoogleOtp()" style="background: #1a1a3a; color: #00ff66; border: 1px solid #00ff66;">SEND VERIFICATION EMAIL</button>
            </div>
            <button onclick="handleRegister()" id="registerBtn">REGISTER NOW (Click after verifying Email)</button>
            <div id="regMsg"></div>
            <div class="toggle-link" onclick="switchView('login')">Already have an account? Login</div>
        </div>

        <!-- Dashboard View (Hidden initially) -->
        <div id="dashboardContainer" style="display: none;">
            <h3>Welcome, <span id="dashUsername"></span></h3>
            <p>Role: <span id="dashRole" style="color: #00ff66;">Customer</span></p>
            <div style="background: #0f0f1a; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                <p>Today's Total Deposit: ₹<span id="totalDeposit">0</span></p>
                <p>Today's Key Count: <span id="keyCount">0</span></p>
            </div>
            <button onclick="handleLogout()" style="background: #ff4d4d; color: #fff;">LOGOUT</button>
        </div>
    </div>

    <script>
        // Yahan apna asli Firebase config daal dena
        const firebaseConfig = {
          apiKey: "TERA_API_KEY",
          authDomain: "TERA_PROJECT.firebaseapp.com",
          projectId: "TERA_PROJECT_ID",
          storageBucket: "TERA_PROJECT.appspot.com",
          messagingSenderId: "123456789",
          appId: "TERA_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function switchView(view) {
            if(view === 'register') {
                document.getElementById('loginFormContainer').style.display = 'none';
                document.getElementById('registerFormContainer').style.display = 'block';
            } else {
                document.getElementById('registerFormContainer').style.display = 'none';
                document.getElementById('loginFormContainer').style.display = 'block';
            }
        }

        function sendGoogleOtp() {
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            const confirmPass = document.getElementById('regPassConfirm').value;
            const username = document.getElementById('regUser').value;

            if (!username || !email || !pass) {
                alert("Bhai, pehle Username, Password aur Email bhar le!");
                return;
            }
            if (pass !== confirmPass) {
                alert("Passwords match nahi ho rahe hain!");
                return;
            }

            const msgBox = document.getElementById('regMsg');
            msgBox.innerHTML = "<div class='success'>Sending Verification Email... Wait...</div>";

            firebase.auth().createUserWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    userCredential.user.sendEmailVerification()
                        .then(() => {
                            msgBox.innerHTML = "<div class='success'>✔ Email sent to " + email + ". Pehle inbox check kar, link pe click karke verify kar, phir 'REGISTER NOW' daba!</div>";
                        })
                        .catch((error) => {
                            msgBox.innerHTML = "<div class='error'>Error: " + error.message + "</div>";
                        });
                })
                .catch((error) => {
                    msgBox.innerHTML = "<div class='error'>Registration Error: " + error.message + "</div>";
                });
        }

        function handleRegister() {
            const user = firebase.auth().currentUser;
            const username = document.getElementById('regUser').value;
            const msgBox = document.getElementById('regMsg');

            if (user) {
                user.reload().then(() => {
                    if (user.emailVerified) {
                        db.collection("resellers").doc(username).set({
                            username: username,
                            email: user.email,
                            role: "Customer",
                            createdAt: new Date()
                        }).then(() => {
                            msgBox.innerHTML = "<span class='success'>Registration successful! Default price: Customer.</span>";
                            setTimeout(() => switchView('login'), 2000);
                        }).catch((err) => {
                            msgBox.innerHTML = "<div class='error'>DB Error: " + err.message + "</div>";
                        });
                    } else {
                        msgBox.innerHTML = "<div class='error'>Bhai pehle apna Gmail open kar aur verification link pe click kar! Uske baad hi register hoga.</div>";
                    }
                });
            } else {
                msgBox.innerHTML = "<div class='error'>Pehle 'SEND VERIFICATION EMAIL' button pe click kar!</div>";
            }
        }

        function handleLogin() {
            const username = document.getElementById('loginUser').value;
            const msgBox = document.getElementById('loginMsg');

            if(!username) {
                msgBox.innerHTML = "<div class='error'>Username daal bhai!</div>";
                return;
            }

            db.collection("resellers").doc(username).get().then((doc) => {
                if(doc.exists) {
                    const data = doc.data();
                    document.getElementById('loginFormContainer').style.display = 'none';
                    document.getElementById('dashboardContainer').style.display = 'block';
                    document.getElementById('dashUsername').innerText = data.username;
                    document.getElementById('dashRole').innerText = data.role || "Customer";
                } else {
                    msgBox.innerHTML = "<div class='error'>User nahi mila! Pehle register kar.</div>";
                }
            }).catch((err) => {
                msgBox.innerHTML = "<div class='error'>Error: " + err.message + "</div>";
            });
        }

        function handleLogout() {
            firebase.auth().signOut().then(() => {
                document.getElementById('dashboardContainer').style.display = 'none';
                document.getElementById('loginFormContainer').style.display = 'block';
            });
        }
    </script>
</body>
</html>
