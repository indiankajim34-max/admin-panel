<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reseller Dashboard & Portal</title>
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/emailjs.min.js"></script>
    <script>
        (function(){
            emailjs.init("ZUU5ITeVeDkKIc994");
        })();
    </script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --danger: #ef4444;
            --border: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: var(--text-main);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        button:hover {
            background: var(--primary-hover);
        }
        .hidden {
            display: none !important;
        }
        .timer-box {
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--danger);
            margin: 15px 0;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 10px;
            text-align: center;
        }
        .summary-card h4 {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .summary-card p {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--accent);
        }
        .qr-container {
            text-align: center;
            margin: 15px 0;
        }
        .qr-container img {
            max-width: 180px;
            border-radius: 8px;
            border: 4px solid white;
        }
        .alert {
            padding: 10px;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--danger);
            color: #fca5a5;
        }
        .alert-success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid var(--accent);
            color: #86efac;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- AUTH VIEW (LOGIN / REGISTER) -->
        <div id="auth-section">
            <h2 id="auth-title">Reseller Login</h2>
            <div id="auth-alert" class="alert hidden"></div>
            
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>Username / Email</label>
                    <input type="text" id="username" required placeholder="Enter username or email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>
                <div class="form-group hidden" id="confirm-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Re-enter password">
                </div>

                <!-- Google OTP Block -->
                <div class="form-group">
                    <label>Google OTP Verification</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="otp-input" placeholder="Enter 6-digit OTP" maxlength="6">
                        <button type="button" onclick="sendGoogleOTP()" style="margin-top: 0; width: 140px; font-size: 0.85rem;">Send OTP</button>
                    </div>
                </div>

                <button type="submit" id="auth-btn">Login</button>
                <p style="text-align: center; margin-top: 15px; font-size: 0.875rem; color: var(--text-muted);">
                    <span id="switch-text">Don't have an account?</span> 
                    <a href="#" onclick="toggleAuthMode()" style="color: var(--primary); text-decoration: none; font-weight: 600;" id="switch-link">Register</a>
                </p>
            </form>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboard-section" class="hidden">
            <h2>Reseller Dashboard</h2>
            <div id="user-role-badge" style="text-align: center; margin-bottom: 15px; font-size: 0.9rem; font-weight: bold; color: var(--accent);"></div>

            <!-- Summary Cards -->
            <div class="summary-grid">
                <div class="summary-card">
                    <h4>Today's Deposit</h4>
                    <p id="total-deposit">₹0</p>
                </div>
                <div class="summary-card">
                    <h4>Today's Keys</h4>
                    <p id="total-keys">0</p>
                </div>
            </div>

            <!-- Deposit / Key Upgrade Area -->
            <div style="background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px;">
                <h3 style="font-size: 1rem; margin-bottom: 10px; text-align: center;">Add Funds / First Deposit</h3>
                <div class="form-group">
                    <label>Deposit Amount (Min ₹500 for Reseller Upgrade)</label>
                    <input type="number" id="deposit-amount" value="500" min="100">
                </div>
                <button type="button" onclick="startDepositProcess()">Proceed to Pay</button>
            </div>

            <button type="button" onclick="handleLogout()" style="background: var(--danger);">Logout</button>
        </div>

        <!-- PAYMENT GATEWAY VIEW (9-Min Timer & BharatPe QR) -->
        <div id="payment-section" class="hidden">
            <h2>Complete Payment</h2>
            <div class="timer-box" id="timer-display">09:00</div>
            
            <div class="qr-container">
                <!-- Sample BharatPe QR Simulation -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=bharatpe.merchant@icici&pn=ResellerPortal&am=" id="dynamic-qr" alt="BharatPe QR">
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 8px;">Scan via any UPI App (GPay, PhonePe, Paytm)</p>
            </div>

            <div class="form-group">
                <label>Enter 12-Digit UTR / Ref Number</label>
                <input type="text" id="utr-input" placeholder="Strict UTR Validation (12 Digits)" maxlength="12">
            </div>

            <button type="button" onclick="verifyAndCompletePayment()">Verify UTR & Submit</button>
            <button type="button" onclick="cancelPayment()" style="background: #64748b; margin-top: 8px;">Cancel</button>
        </div>
    </div>

    <script>
        // State Management
        let isRegisterMode = false;
        let generatedOTP = "";
        let paymentTimerInterval = null;
        let currentUser = null;

        // Midnight Reset & Session Initialization
        window.addEventListener('DOMContentLoaded', () => {
            checkMidnightReset();
            checkSingleDeviceSession();
        });

        function checkMidnightReset() {
            const lastResetDate = localStorage.getItem('last_reset_date');
            const todayStr = new Date().toDateString();
            if (lastResetDate !== todayStr) {
                localStorage.setItem('today_deposit', '0');
                localStorage.setItem('today_keys', '0');
                localStorage.setItem('last_reset_date', todayStr);
            }
        }

        function checkSingleDeviceSession() {
            const activeSession = localStorage.getItem('active_device_session');
            const loggedInUser = localStorage.getItem('logged_in_user');
            if (activeSession && loggedInUser) {
                currentUser = loggedInUser;
                showDashboard();
            }
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? "Reseller Register" : "Reseller Login";
            document.getElementById('auth-btn').innerText = isRegisterMode ? "Register" : "Login";
            document.getElementById('switch-text').innerText = isRegisterMode ? "Already have an account?" : "Don't have an account?";
            document.getElementById('switch-link').innerText = isRegisterMode ? "Login" : "Register";
            document.getElementById('confirm-group').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('auth-alert').classList.add('hidden');
        }

        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('auth-alert');
            alertBox.innerText = message;
            alertBox.className = `alert ${type === 'success' ? 'alert-success' : 'alert-error'}`;
            alertBox.classList.remove('hidden');
        }

        // Google OTP via EmailJS (Using exact verified service & template ID)
        function sendGoogleOTP() {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                showAlert("Please enter your username/email first to send OTP!");
                return;
            }

            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            
            const templateParams = {
                to_email: username,
                otp_code: generatedOTP,
                passcode: generatedOTP
            };

            // Using verified Service ID: service_nxa9rzb & Template ID: template_2gamlua
            emailjs.send('service_nxa9rzb', 'template_2gamlua', templateParams)
                .then(function(response) {
                    showAlert("Google OTP sent successfully to your email!", "success");
                }, function(error) {
                    showAlert("Failed to send OTP. Check email or configuration.");
                    console.error('EmailJS Error:', error);
                });
        }

        function handleAuth(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const otpInput = document.getElementById('otp-input').value.trim();

            if (otpInput !== generatedOTP) {
                showAlert("Invalid Google OTP! Please enter the correct OTP.");
                return;
            }

            if (isRegisterMode) {
                const confirmPass = document.getElementById('confirm-password').value.trim();
                if (password !== confirmPass) {
                    showAlert("Passwords do not match!");
                    return;
                }
                localStorage.setItem('db_user_' + username, JSON.stringify({ password, role: 'Customer' }));
                showAlert("Registration successful! Now please login.", "success");
                toggleAuthMode();
            } else {
                const storedData = localStorage.getItem('db_user_' + username);
                if (!storedData) {
                    showAlert("User not found! Please register first.");
                    return;
                }
                const parsed = JSON.parse(storedData);
                if (parsed.password !== password) {
                    showAlert("Incorrect password!");
                    return;
                }

                // Single-Device Session Enforcement
                const uniqueSessionId = 'session_' + Date.now();
                localStorage.setItem('active_device_session', uniqueSessionId);
                localStorage.setItem('logged_in_user', username);
                currentUser = username;

                showDashboard();
            }
        }

        function showDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('payment-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');

            const userData = JSON.parse(localStorage.getItem('db_user_' + currentUser) || '{"role":"Customer"}');
            document.getElementById('user-role-badge').innerText = `Role: ${userData.role} Account`;

            document.getElementById('total-deposit').innerText = '₹' + (localStorage.getItem('today_deposit') || '0');
            document.getElementById('total-keys').innerText = localStorage.getItem('today_keys') || '0';
        }

        function startDepositProcess() {
            const amount = document.getElementById('deposit-amount').value;
            if (!amount || amount < 100) {
                alert("Minimum deposit amount is ₹100");
                return;
            }

            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('payment-section').classList.remove('hidden');

            // 9-Minute Timer Initialization
            startPaymentTimer(9 * 60);
        }

        function startPaymentTimer(duration) {
            let timer = duration;
            const display = document.getElementById('timer-display');
            
            if (paymentTimerInterval) clearInterval(paymentTimerInterval);

            paymentTimerInterval = setInterval(() => {
                let minutes = parseInt(timer / 60, 10);
                let seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.innerText = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(paymentTimerInterval);
                    alert("Payment session timed out! Please try again.");
                    cancelPayment();
                }
            }, 1000);
        }

        function verifyAndCompletePayment() {
            const utr = document.getElementById('utr-input').value.trim();
            if (utr.length !== 12 || isNaN(utr)) {
                alert("Invalid UTR! Strict validation requires exactly 12 numeric digits.");
                return;
            }

            clearInterval(paymentTimerInterval);
            
            const depositAmount = parseFloat(document.getElementById('deposit-amount').value);
            let currentDeposit = parseFloat(localStorage.getItem('today_deposit') || '0');
            let currentKeys = parseInt(localStorage.getItem('today_keys') || '0');

            currentDeposit += depositAmount;
            currentKeys += 1;

            localStorage.setItem('today_deposit', currentDeposit);
            localStorage.setItem('today_keys', currentKeys);

            // Automatic Reseller upgrade on first deposit of ₹500 or above
            let userData = JSON.parse(localStorage.getItem('db_user_' + currentUser));
            if (depositAmount >= 500) {
                userData.role = 'Reseller';
                localStorage.setItem('db_user_' + currentUser, JSON.stringify(userData));
                alert("Payment Verified! First deposit >= ₹500. Account upgraded to Reseller successfully!");
            } else {
                alert("Payment Verified Successfully! (Default Customer Price Applied)");
            }

            document.getElementById('utr-input').value = '';
            showDashboard();
        }

        function cancelPayment() {
            if (paymentTimerInterval) clearInterval(paymentTimerInterval);
            document.getElementById('payment-section').classList.add('hidden');
            showDashboard();
        }

        function handleLogout() {
            localStorage.removeItem('active_device_session');
            localStorage.removeItem('logged_in_user');
            currentUser = null;
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('otp-input').value = '';
        }
    </script>
</body>
</html>
