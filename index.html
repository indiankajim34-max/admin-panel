<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinGo VIP - Standalone Admin & Reseller Panel</title>
    <!-- Firebase SDK (Compat Version for Easy Integration) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a14; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 420px; background: #121224; border-radius: 20px; padding: 22px; box-shadow: 0 0 25px rgba(0, 240, 255, 0.3); border: 2px solid #00f0ff; box-sizing: border-box; }
        h2 { text-align: center; color: #00ff66; margin-bottom: 20px; font-size: 20px; letter-spacing: 1px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #1a1a3a; color: white; box-sizing: border-box; font-size: 14px; outline: none; }
        button { width: 100%; padding: 12px; background: linear-gradient(45deg, #00ff66, #00b344); border: none; font-weight: bold; color: #000; border-radius: 8px; cursor: pointer; margin-top: 10px; font-size: 15px; }
        button:hover { opacity: 0.9; }
        .card { background: rgba(255, 255, 255, 0.04); padding: 16px; border-radius: 12px; margin-top: 15px; border: 1px solid rgba(0, 240, 255, 0.15); text-align: left; }
        .key-box { background: #000; padding: 12px; color: #00ff66; font-family: monospace; word-break: break-all; border-radius: 8px; margin-top: 12px; text-align: center; border: 1px dashed #00ff66; font-size: 15px; }
        .error { color: #ff4444; font-size: 13px; margin-top: 8px; text-align: center; font-weight: bold; }
        .success { color: #00ff66; font-size: 13px; margin-top: 8px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="auth-screen">
    <h2>ADMIN & RESELLER LOGIN</h2>
    <div class="input-group">
        <label>Username / Admin ID</label>
        <input type="text" id="loginUser" placeholder="Enter username (e.g. admin)">
    </div>
    <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Enter password">
    </div>
    <button onclick="handleAdminLogin()">LOGIN TO PANEL</button>
    <div id="loginMsg"></div>
</div>

<div class="container" id="dashboard-screen" style="display: none;">
    <h2 id="dashTitle">PANEL DASHBOARD</h2>
    
    <div class="card" id="walletCard" style="display: none;">
        <div style="font-size: 13px; color: #aaa;">Wallet Balance:</div>
        <div style="font-size: 26px; color: #00ff66; font-weight: bold;">₹<span id="walletBalance">0</span></div>
        <div style="font-size: 11px; color: #888; margin-top: 4px;">(Har key generate karne par ₹50 katenge)</div>
    </div>

    <div class="card" id="masterInfoCard" style="display: none;">
        <div style="color: #ffcc00; font-size: 13px; font-weight: bold;">⚡ Master Admin Access</div>
        <div style="font-size: 12px; color: #aaa; margin-top: 3px;">Unlimited Key Generation Enabled (No wallet deduction).</div>
    </div>

    <div class="card">
        <h4 style="color: #00f0ff; margin: 0 0 10px 0;">Generate License Key</h4>
        <div class="input-group">
            <label>Select Validity</label>
            <select id="keyHours">
                <option value="24">24 Hours (1 Day)</option>
                <option value="168">1 Week</option>
                <option value="720">1 Month</option>
            </select>
        </div>
        <button onclick="generateKey()">CREATE KEY</button>
        <div id="genMsg"></div>
        <div class="key-box" id="generatedKeyDisplay" style="display: none;"></div>
    </div>

    <button onclick="handleLogout()" style="background: rgba(255, 68, 68, 0.2); border: 1px solid #ff4444; color: #ff6666; margin-top: 20px;">LOGOUT</button>
</div>

<script>
    // Firebase Configuration (Direct from your project settings)
    const firebaseConfig = {
      apiKey: "AIzaSyD_24prkpu6ylZITC1B",
      authDomain: "wingo-vip-759b9.firebaseapp.com",
      projectId: "wingo-vip-759b9",
      storageBucket: "wingo-vip-759b9.firebasestorage.app",
      messagingSenderId: "304008432437"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUsername = '';
    let currentUserRole = ''; // 'master' or 'reseller'
    let resellerWalletBalance = 0;

    async function handleAdminLogin() {
        const user = document.getElementById('loginUser').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        const msgDiv = document.getElementById('loginMsg');
        msgDiv.innerHTML = '';

        if (!user || !pass) {
            msgDiv.innerHTML = "<div class='error'>Sabhi fields bharein!</div>";
            return;
        }

        // 1. Check Master Admin Credentials (Updated to kajim_master & Kajim@786)
        if (user === 'kajim_master' && pass === 'Kajim@786') {
            currentUsername = 'Master Admin';
            currentUserRole = 'master';
            initDashboard();
            return;
        }

        // 2. Check Reseller Credentials from Firestore 'resellers' collection
        try {
            const resellerRef = db.collection('resellers').doc(user);
            const docSnap = await resellerRef.get();

            if (docSnap.exists) {
                const data = docSnap.data();
                if (data.password === pass) {
                    currentUsername = user;
                    currentUserRole = 'reseller';
                    resellerWalletBalance = data.wallet || 0;
                    initDashboard();
                } else {
                    msgDiv.innerHTML = "<div class='error'>❌ Galat Password!</div>";
                }
            } else {
                msgDiv.innerHTML = "<div class='error'>❌ Reseller account nahi mila!</div>";
            }
        } catch (err) {
            msgDiv.innerHTML = "<div class='error'>Server Error: " + err.message + "</div>";
        }
    }

    function initDashboard() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'block';

        if (currentUserRole === 'master') {
            document.getElementById('dashTitle').innerText = 'MASTER ADMIN PANEL';
            document.getElementById('masterInfoCard').style.display = 'block';
            document.getElementById('walletCard').style.display = 'none';
        } else {
            document.getElementById('dashTitle').innerText = 'RESELLER: ' + currentUsername;
            document.getElementById('masterInfoCard').style.display = 'none';
            document.getElementById('walletCard').style.display = 'block';
            document.getElementById('walletBalance').innerText = resellerWalletBalance;
        }
    }

    async function generateKey() {
        const hours = parseInt(document.getElementById('keyHours').value);
        const genMsg = document.getElementById('genMsg');
        const keyDisplay = document.getElementById('generatedKeyDisplay');
        genMsg.innerHTML = '';
        keyDisplay.style.display = 'none';

        const randomStr = Math.random().toString(36).substring(2, 10).toUpperCase();
        const newKey = `WINGO-${hours}H-${randomStr}`;
        const keyCost = 50; // रिसेलर के लिए प्रति की कीमत

        try {
            if (currentUserRole === 'reseller') {
                const resellerRef = db.collection('resellers').doc(currentUsername);
                const docSnap = await resellerRef.get();
                const currentWallet = docSnap.exists ? (docSnap.data().wallet || 0) : 0;

                if (currentWallet < keyCost) {
                    genMsg.innerHTML = "<div class='error'>❌ Wallet me sufficient balance nahi hai! (Need ₹" + keyCost + ")</div>";
                    return;
                }

                // Deduct balance from reseller wallet in Firestore
                const newBalance = currentWallet - keyCost;
                await resellerRef.update({ wallet: newBalance });
                resellerWalletBalance = newBalance;
                document.getElementById('walletBalance').innerText = newBalance;
            }

            // Save new key to Firestore 'keys' collection
            await db.collection('keys').doc(newKey).set({
                durationHours: hours,
                createdAt: Date.now(),
                isExpired: false,
                generatedBy: currentUsername,
                boundDeviceId: null
            });

            genMsg.innerHTML = "<div class='success'>✅ Key safaltapoorvak generate ho gayi!</div>";
            keyDisplay.style.display = 'block';
            keyDisplay.innerText = newKey;

        } catch (err) {
            genMsg.innerHTML = "<div class='error'>Error: " + err.message + "</div>";
        }
    }

    function handleLogout() {
        currentUsername = '';
        currentUserRole = '';
        document.getElementById('dashboard-screen').style.display = 'none';
        document.getElementById('auth-screen').style.display = 'block';
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('loginMsg').innerText = '';
        document.getElementById('generatedKeyDisplay').style.display = 'none';
    }
</script>

</body>
    </html>
